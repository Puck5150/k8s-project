
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
  namespace: networking
  labels:
    app: pihole
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pihole
  template:
    metadata:
      labels:
        app: pihole
    spec:
      nodeSelector:
        kubernetes.io/hostname: homelab

      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      containers:
        - name: pihole
          image: pihole/pihole:latest
          imagePullPolicy: IfNotPresent

          env:
            - name: TZ
              value: "America/Chicago"

            - name: FTLCONF_webserver_api_password
              valueFrom:
                secretKeyRef:
                  name: pihole-admin
                  key: password

            - name: FTLCONF_webserver_port
              value: "8081"

            - name: FTLCONF_dns_listeningMode
              value: "LOCAL"

            - name: FTLCONF_dns_upstreams
              value: "1.1.1.1;9.9.9.9"

          ports:
            - name: dns-tcp
              containerPort: 53
              protocol: TCP

            - name: dns-udp
              containerPort: 53
              protocol: UDP

            - name: web
              containerPort: 8081
              protocol: TCP

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "1Gi"
              cpu: "500m"
          volumeMounts:
            - name: pihole-config
              mountPath: /etc/pihole

      volumes:
        - name: pihole-config
          hostPath:
            path: /srv/pihole/etc-pihole
            type: Directory
